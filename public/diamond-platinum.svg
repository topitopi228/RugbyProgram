<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Радіальний градієнт для діаманта -->
    <radialGradient id="diamondCenter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#E0F7FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#A8DAFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6BB6FF;stop-opacity:1" />
    </radialGradient>

    <!-- Градієнт для граней -->
    <linearGradient id="facetGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#A8DAFF;stop-opacity:0.6" />
    </linearGradient>

    <linearGradient id="facetGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#C4E4FF;stop-opacity:0.5" />
    </linearGradient>

    <linearGradient id="facetGradient3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6BB6FF;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#A8DAFF;stop-opacity:0.4" />
    </linearGradient>

    <!-- Фіолетове світіння -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E0C3FC;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:0" />
    </radialGradient>

    <!-- Фільтр для блиску -->
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Фільтр для сяйва -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Зовнішнє фіолетове сяйво -->
  <circle cx="100" cy="100" r="90" fill="url(#purpleGlow)" opacity="0.6"/>

  <!-- Промені світла від діаманта -->
  <g opacity="0.4">
    <line x1="100" y1="100" x2="100" y2="10" stroke="#E0F7FF" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="170" y2="40" stroke="#C4E4FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="180" y2="100" stroke="#A8DAFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="170" y2="160" stroke="#C4E4FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="30" y2="40" stroke="#C4E4FF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="20" y2="100" stroke="#A8DAFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="30" y2="160" stroke="#C4E4FF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Основний діамант -->
  <g filter="url(#glow)">
    <!-- Верхня частина (корона) -->
    <!-- Центральна верхня грань -->
    <polygon points="100,30 70,80 130,80" fill="url(#facetGradient1)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Ліва верхня грань -->
    <polygon points="70,80 50,60 100,30" fill="url(#facetGradient2)" stroke="#E0F7FF" stroke-width="1" opacity="0.9"/>
    
    <!-- Права верхня грань -->
    <polygon points="130,80 150,60 100,30" fill="url(#facetGradient2)" stroke="#E0F7FF" stroke-width="1" opacity="0.9"/>

    <!-- Середня частина (пояс) -->
    <!-- Ліва середня грань -->
    <polygon points="50,60 40,100 70,80" fill="url(#facetGradient3)" stroke="#A8DAFF" stroke-width="1" opacity="0.85"/>
    
    <!-- Центральна ліва грань -->
    <polygon points="70,80 40,100 100,100" fill="url(#diamondCenter)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Центральна права грань -->
    <polygon points="130,80 160,100 100,100" fill="url(#diamondCenter)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.95"/>
    
    <!-- Права середня грань -->
    <polygon points="150,60 160,100 130,80" fill="url(#facetGradient3)" stroke="#A8DAFF" stroke-width="1" opacity="0.85"/>

    <!-- Нижня частина (павільйон) -->
    <!-- Ліва нижня грань -->
    <polygon points="40,100 70,80 100,170" fill="url(#facetGradient3)" stroke="#6BB6FF" stroke-width="1" opacity="0.8"/>
    
    <!-- Центральна нижня ліва грань -->
    <polygon points="70,80 100,100 100,170" fill="url(#facetGradient1)" stroke="#A8DAFF" stroke-width="1" opacity="0.85"/>
    
    <!-- Центральна нижня права грань -->
    <polygon points="130,80 100,100 100,170" fill="url(#facetGradient1)" stroke="#A8DAFF" stroke-width="1" opacity="0.85"/>
    
    <!-- Права нижня грань -->
    <polygon points="160,100 130,80 100,170" fill="url(#facetGradient3)" stroke="#6BB6FF" stroke-width="1" opacity="0.8"/>
  </g>

  <!-- Блискучі відблиски -->
  <g filter="url(#sparkle)" opacity="0.9">
    <!-- Головний відблиск зверху -->
    <ellipse cx="95" cy="50" rx="8" ry="12" fill="#FFFFFF" opacity="0.8"/>
    <ellipse cx="95" cy="50" rx="4" ry="6" fill="#FFFFFF"/>
    
    <!-- Бічні відблиски -->
    <circle cx="75" cy="75" r="3" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="125" cy="75" r="3" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Нижні відблиски -->
    <ellipse cx="105" cy="110" rx="5" ry="3" fill="#E0F7FF" opacity="0.6"/>
    <circle cx="85" cy="130" r="2" fill="#C4E4FF" opacity="0.5"/>
  </g>

  <!-- Маленькі зірочки навколо -->
  <g fill="#FFFFFF" opacity="0.8" filter="url(#sparkle)">
    <circle cx="45" cy="45" r="2"/>
    <circle cx="155" cy="45" r="2"/>
    <circle cx="175" cy="100" r="1.5"/>
    <circle cx="25" cy="100" r="1.5"/>
    <circle cx="45" cy="155" r="2"/>
    <circle cx="155" cy="155" r="2"/>
  </g>

  <!-- Додаткові хрестики-блискавки -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="40" y1="40" x2="50" y2="50"/>
    <line x1="50" y1="40" x2="40" y2="50"/>
    
    <line x1="150" y1="40" x2="160" y2="50"/>
    <line x1="160" y1="40" x2="150" y2="50"/>
    
    <line x1="40" y1="150" x2="50" y2="160"/>
    <line x1="50" y1="150" x2="40" y2="160"/>
    
    <line x1="150" y1="150" x2="160" y2="160"/>
    <line x1="160" y1="150" x2="150" y2="160"/>
  </g>

  <!-- Текст PLATINUM знизу -->
  <text x="100" y="190" 
        font-family="Arial, sans-serif" 
        font-size="12" 
        font-weight="bold" 
        fill="url(#diamondCenter)" 
        text-anchor="middle"
        filter="url(#sparkle)"
        letter-spacing="2">
    PLATINUM
  </text>
</svg>
